# SPDX-License-Identifier: LicenseRef-KMediaVlc-Proprietary

name: Build source VLC Windows audit candidate

on:
  workflow_dispatch:
    inputs:
      tested_commit:
        description: Exact forty-character KMediaVlc commit tested locally
        required: true
        type: string
      candidate_version:
        description: Immutable SemVer intended for this audited candidate
        required: true
        default: 0.1.0-rc.1
        type: string

permissions:
  contents: read

concurrency:
  group: kmediavlc-native-audit-${{ inputs.tested_commit }}
  cancel-in-progress: false

jobs:
  build-windows-x86-64:
    name: Build VLC with the pinned VideoLAN UCRT toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      runtime_sha256: ${{ steps.package.outputs.runtime_sha256 }}
    container:
      image: registry.videolan.org/vlc-debian-llvm-ucrt:20260611225331
      options: --user 0
    env:
      TESTED_COMMIT: ${{ inputs.tested_commit }}
      CANDIDATE_VERSION: ${{ inputs.candidate_version }}
      VLC_REVISION: b5536cdea24b313ba9215eacfbd7fa3295d7f3ee
      TOOLCHAIN_IMAGE: registry.videolan.org/vlc-debian-llvm-ucrt:20260611225331
    steps:
      - name: Check out the exact KMediaVlc revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tested_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the exact VLC source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: videolan/vlc
          ref: b5536cdea24b313ba9215eacfbd7fa3295d7f3ee
          path: .vlc-source
          fetch-depth: 1
          persist-credentials: false

      - name: Bind the audit candidate to immutable sources
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.vlc-source"
          [[ "$TESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          test "$(git -C .vlc-source rev-parse HEAD)" = "$VLC_REVISION"
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C .vlc-source status --porcelain --untracked-files=no)"
          python3 scripts/verify_source_compliance.py --root .

      - name: Verify and record the UCRT toolchain
        shell: bash
        run: |
          cc=x86_64-w64-mingw32-gcc
          cxx=x86_64-w64-mingw32-g++
          command -v "$cc"
          command -v "$cxx"
          command -v x86_64-w64-mingw32-strip
          command -v x86_64-w64-mingw32-windres
          command -v meson
          if printf '#include <crtdefs.h>\n#if defined(_UCRT) || (__MSVCRT_VERSION__ >= 0x1400) || (__MSVCRT_VERSION__ >= 0xE00 && __MSVCRT_VERSION__ < 0x1000)\n#error UCRT\n#endif\n' |
              "$cc" -E - >/dev/null 2>&1; then
            echo "The selected compiler is not a UCRT toolchain." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/audit-assets"
          {
            echo "container=$TOOLCHAIN_IMAGE"
            echo "kmediavlc=$TESTED_COMMIT"
            echo "vlc=$VLC_REVISION"
            "$cc" --version
            "$cxx" --version
            "$cc" -print-search-dirs
            meson --version
            cat /etc/os-release
            printf '\nUCRT macros:\n'
            printf '#include <crtdefs.h>\n' | "$cc" -dM -E - | sort |
              grep -E '^#define (_UCRT|__MSVCRT_VERSION__|_WIN32_WINNT|WINVER)'
          } > "$RUNNER_TEMP/audit-assets/toolchain.txt"
          {
            for archive in \
              libunwind.a \
              libpthread.a \
              libc++.a \
              libc++abi.a \
              libclang_rt.builtins-x86_64.a; do
              resolved="$("$cxx" --print-file-name="$archive")"
              if [[ "$resolved" != "$archive" && -f "$resolved" ]]; then
                sha256sum "$resolved"
              fi
            done
            runtime="$("$cc" -print-libgcc-file-name)"
            test -f "$runtime"
            sha256sum "$runtime"
          } | sort -u > "$RUNNER_TEMP/audit-assets/toolchain-static-archives-SHA256SUMS"
          test -s "$RUNNER_TEMP/audit-assets/toolchain-static-archives-SHA256SUMS"

          license_root="$RUNNER_TEMP/audit-assets/toolchain-licenses"
          mkdir "$license_root"
          while IFS= read -r -d '' license; do
            relative="${license#/opt/llvm-mingw/}"
            destination="$license_root/$relative"
            mkdir -p "$(dirname "$destination")"
            cp "$license" "$destination"
          done < <(find /opt/llvm-mingw -type f \
            \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) \
            -print0 | sort -z)
          test -n "$(find "$license_root" -type f -print -quit)"

      - name: Restore the exact source-built contrib cache
        id: contrib_cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            .vlc-source/contrib/tarballs
            .vlc-source/contrib/x86_64-w64-mingw32ucrt
            .vlc-source/contrib/contrib-win64-ucrt
            .vlc-source/contrib/python-venv
            .vlc-source/extras/tools/build
            .vlc-source/win64-ucrt-meson
          key: vlc-b5536cde-windows-x86_64-llvm-ucrt-lgpl-playback-20260611225331-v5
          restore-keys: |
            vlc-b5536cde-windows-x86_64-llvm-ucrt-lgpl-20260611225331-v4
            vlc-b5536cde-windows-x86_64-llvm-ucrt-20260611225331-v3
            vlc-b5536cde-windows-x86_64-llvm-ucrt-20260611225331-v2
            vlc-b5536cde-windows-x86_64-llvm-ucrt-20260611225331-v1

      - name: Prepare the exact playback contrib state
        env:
          EXACT_CACHE_HIT: ${{ steps.contrib_cache.outputs.cache-hit }}
        shell: bash
        run: |
          venv=.vlc-source/contrib/python-venv
          stamp=.vlc-source/contrib/contrib-win64-ucrt/.python-venv
          if [[ -f "$stamp" && ! -x "$venv/bin/pip3" ]]; then
            rm -f "$stamp"
          fi
          if [[ "$EXACT_CACHE_HIT" != true ]]; then
            rm -rf \
              .vlc-source/contrib/x86_64-w64-mingw32ucrt \
              .vlc-source/contrib/contrib-win64-ucrt \
              .vlc-source/win64-ucrt-meson
          fi

      - name: Build headless libVLC and required contribs from source
        id: source_build
        continue-on-error: true
        shell: bash
        env:
          HOME: ${{ runner.temp }}/container-home
          JOBS: 4
          WINEPREFIX: ${{ runner.temp }}/wine-prefix
        run: |
          mkdir -p "$HOME" "$WINEPREFIX"
          bash scripts/build_vlc_windows.sh \
            "$GITHUB_WORKSPACE/.vlc-source" \
            x86_64 \
            "$RUNNER_TEMP/vlc-install"

      - name: Save source-built VLC state for an exact retry
        if: always() && steps.contrib_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            .vlc-source/contrib/tarballs
            .vlc-source/contrib/x86_64-w64-mingw32ucrt
            .vlc-source/contrib/contrib-win64-ucrt
            .vlc-source/contrib/python-venv
            .vlc-source/extras/tools/build
            .vlc-source/win64-ucrt-meson
          key: vlc-b5536cde-windows-x86_64-llvm-ucrt-lgpl-playback-20260611225331-v5

      - name: Require a successful source build
        if: steps.source_build.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Close the candidate file and source inventories
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/vlc-install/bin/libvlc.dll"
          test "$(find "$RUNNER_TEMP/vlc-install" -type f -iname libvlc.dll | wc -l)" -eq 1
          test -f "$RUNNER_TEMP/vlc-install/bin/libvlccore-9.dll"
          test "$(find "$RUNNER_TEMP/vlc-install" -type f -iname libvlccore-9.dll | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/vlc-install" -type f -iname '*.dll' | wc -l)" -gt 2
          test -z "$(git -C .vlc-source status --porcelain --untracked-files=no)"
          (
            cd "$RUNNER_TEMP/vlc-install"
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/audit-assets/installed-SHA256SUMS"
          test -s "$RUNNER_TEMP/audit-assets/installed-SHA256SUMS"
          (
            cd .vlc-source/contrib/tarballs
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/audit-assets/contrib-source-SHA256SUMS"
          test -s "$RUNNER_TEMP/audit-assets/contrib-source-SHA256SUMS"
          meson_info=.vlc-source/win64-ucrt-meson/meson-info
          for metadata in \
            intro-buildoptions.json \
            intro-dependencies.json \
            intro-installed.json \
            intro-install_plan.json \
            intro-machines.json \
            intro-targets.json; do
            test -s "$meson_info/$metadata"
          done
          cp -a "$meson_info" "$RUNNER_TEMP/audit-assets/meson-info"
          build_root=.vlc-source/win64-ucrt-meson
          for metadata in build.ninja compile_commands.json meson-logs/meson-log.txt; do
            test -s "$build_root/$metadata"
            destination="$(printf '%s' "$metadata" | tr '/' '-')"
            cp "$build_root/$metadata" "$RUNNER_TEMP/audit-assets/$destination"
          done
          ninja -C "$build_root" -t commands \
            > "$RUNNER_TEMP/audit-assets/ninja-commands.txt"
          ninja -C "$build_root" -t graph \
            > "$RUNNER_TEMP/audit-assets/ninja-graph.dot"
          test -s "$RUNNER_TEMP/audit-assets/ninja-commands.txt"
          test -s "$RUNNER_TEMP/audit-assets/ninja-graph.dot"

      - name: Package the audit runtime and complete source candidate
        id: package
        shell: bash
        run: |
          epoch="$(git show -s --format=%ct "$TESTED_COMMIT")"
          source_root="$RUNNER_TEMP/corresponding-source"
          mkdir -p \
            "$source_root/kmediavlc" \
            "$source_root/vlc" \
            "$source_root/contrib-tarballs" \
            "$source_root/toolchain-licenses"
          git archive "$TESTED_COMMIT" | tar -xf - -C "$source_root/kmediavlc"
          git -C .vlc-source archive "$VLC_REVISION" | tar -xf - -C "$source_root/vlc"
          cp -a .vlc-source/contrib/tarballs/. "$source_root/contrib-tarballs/"
          cp "$RUNNER_TEMP/audit-assets/toolchain.txt" "$source_root/BUILD-TOOLCHAIN.txt"
          cp "$RUNNER_TEMP/audit-assets/toolchain-static-archives-SHA256SUMS" \
            "$source_root/TOOLCHAIN-STATIC-ARCHIVES-SHA256SUMS"
          cp -a "$RUNNER_TEMP/audit-assets/toolchain-licenses/." \
            "$source_root/toolchain-licenses/"
          cp "$RUNNER_TEMP/audit-assets/contrib-source-SHA256SUMS" \
            "$source_root/contrib-source-SHA256SUMS"
          tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
            -czf "$RUNNER_TEMP/audit-assets/vlc-windows-x86_64-source-build.tar.gz" \
            -C "$RUNNER_TEMP" vlc-install
          tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
            -czf "$RUNNER_TEMP/audit-assets/kmedia-vlc-corresponding-source-candidate.tar.gz" \
            -C "$RUNNER_TEMP" corresponding-source
          python3 scripts/package_corresponding_source.py \
            --root "$GITHUB_WORKSPACE" \
            --candidate "$RUNNER_TEMP/audit-assets/kmedia-vlc-corresponding-source-candidate.tar.gz" \
            --output "$RUNNER_TEMP/audit-assets/kmedia-vlc-$CANDIDATE_VERSION-corresponding-source-audit.tar.gz" \
            --tested-commit "$TESTED_COMMIT" \
            --version "$CANDIDATE_VERSION" \
            --epoch "$epoch"
          (
            cd "$RUNNER_TEMP/audit-assets"
            sha256sum \
              "kmedia-vlc-$CANDIDATE_VERSION-corresponding-source-audit.tar.gz" \
              > corresponding-source-SHA256SUMS
          )
          runtime_sha256="$(sha256sum \
            "$RUNNER_TEMP/audit-assets/vlc-windows-x86_64-source-build.tar.gz" | cut -d ' ' -f 1)"
          test "$runtime_sha256" != ""
          echo "runtime_sha256=$runtime_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload the runtime for native Windows validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vlc-windows-x86_64-runtime-input-${{ inputs.tested_commit }}
          path: ${{ runner.temp }}/audit-assets/vlc-windows-x86_64-source-build.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload the reviewed corresponding-source candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vlc-windows-x86_64-source-audit-${{ inputs.tested_commit }}
          path: |
            ${{ runner.temp }}/audit-assets/corresponding-source-SHA256SUMS
            ${{ runner.temp }}/audit-assets/kmedia-vlc-${{ inputs.candidate_version }}-corresponding-source-audit.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload the source and native link review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vlc-windows-x86_64-link-audit-${{ inputs.tested_commit }}
          path: |
            ${{ runner.temp }}/audit-assets/toolchain.txt
            ${{ runner.temp }}/audit-assets/toolchain-static-archives-SHA256SUMS
            ${{ runner.temp }}/audit-assets/toolchain-licenses
            ${{ runner.temp }}/audit-assets/installed-SHA256SUMS
            ${{ runner.temp }}/audit-assets/contrib-source-SHA256SUMS
            ${{ runner.temp }}/audit-assets/meson-info
            ${{ runner.temp }}/audit-assets/build.ninja
            ${{ runner.temp }}/audit-assets/compile_commands.json
            ${{ runner.temp }}/audit-assets/meson-logs-meson-log.txt
            ${{ runner.temp }}/audit-assets/ninja-commands.txt
            ${{ runner.temp }}/audit-assets/ninja-graph.dot
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

  validate-windows-x86-64:
    name: Load and test the source-built runtime on Windows
    needs: build-windows-x86-64
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      TESTED_COMMIT: ${{ inputs.tested_commit }}
      CANDIDATE_VERSION: ${{ inputs.candidate_version }}
      VLC_REVISION: b5536cdea24b313ba9215eacfbd7fa3295d7f3ee
      EXPECTED_RUNTIME_SHA256: ${{ needs.build-windows-x86-64.outputs.runtime_sha256 }}
      KMEDIAVLC_TEST_HTTPS_HDR_MEDIA: https://raw.githubusercontent.com/chromium/chromium/85af8764718f33f0d221e96f31f5d993f364b4a2/media/test/data/bear-1280x720-hevc-10bit-hdr10.mp4
    steps:
      - name: Check out the exact KMediaVlc revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tested_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the exact VLC headers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: videolan/vlc
          ref: b5536cdea24b313ba9215eacfbd7fa3295d7f3ee
          path: .vlc-source
          sparse-checkout: include
          fetch-depth: 1
          persist-credentials: false

      - name: Bind native validation to immutable sources
        shell: pwsh
        run: |
          if ($env:TESTED_COMMIT -notmatch '^[0-9a-f]{40}$') {
            throw 'tested_commit must be an exact lowercase commit.'
          }
          if ((git rev-parse HEAD).Trim() -ne $env:TESTED_COMMIT) {
            throw 'KMediaVlc checkout does not match tested_commit.'
          }
          if ((git -C .vlc-source rev-parse HEAD).Trim() -ne $env:VLC_REVISION) {
            throw 'VLC headers do not match the pinned source build.'
          }

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Download the source-built runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vlc-windows-x86_64-runtime-input-${{ inputs.tested_commit }}
          path: ${{ runner.temp }}/runtime-input

      - name: Verify and extract the exact runtime archive
        shell: pwsh
        run: |
          $inputDirectory = Join-Path $env:RUNNER_TEMP 'runtime-input'
          $archives = @(
            Get-ChildItem -LiteralPath $inputDirectory -Recurse -File `
              -Filter 'vlc-windows-x86_64-source-build.tar.gz'
          )
          if ($archives.Count -ne 1) {
            throw 'The downloaded artifact has no unique runtime archive.'
          }
          if ($env:EXPECTED_RUNTIME_SHA256 -notmatch '^[0-9a-f]{64}$') {
            throw 'The source-build job did not close the runtime SHA-256 output.'
          }
          $archive = $archives[0].FullName
          $expected = $env:EXPECTED_RUNTIME_SHA256
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Runtime archive digest mismatch: $actual"
          }

          $extracted = Join-Path $env:RUNNER_TEMP 'source-built-runtime'
          New-Item -ItemType Directory -Path $extracted | Out-Null
          & tar.exe -xzf $archive -C $extracted
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the source-built runtime.' }
          $install = Join-Path $extracted 'vlc-install'
          $libVlc = @(Get-ChildItem -LiteralPath $install -Recurse -File -Filter 'libvlc.dll')
          $libVlcCore = @(Get-ChildItem -LiteralPath $install -Recurse -File -Filter 'libvlccore-9.dll')
          $pluginDirectories = @(
            Get-ChildItem -LiteralPath $install -Recurse -Directory |
              Where-Object {
                $_.Name -eq 'plugins' -and
                @(Get-ChildItem -LiteralPath $_.FullName -Recurse -File -Filter '*.dll').Count -gt 0
              }
          )
          if ($libVlc.Count -ne 1 -or $libVlcCore.Count -ne 1 -or $pluginDirectories.Count -ne 1) {
            throw 'The source-built runtime layout is ambiguous or incomplete.'
          }
          "KMEDIAVLC_RAW_INSTALL=$install" >> $env:GITHUB_ENV
          "KMEDIAVLC_RAW_LIBVLC=$($libVlc[0].FullName)" >> $env:GITHUB_ENV
          "KMEDIAVLC_RAW_LIBVLCCORE=$($libVlcCore[0].FullName)" >> $env:GITHUB_ENV
          "KMEDIAVLC_RAW_PLUGINS=$($pluginDirectories[0].FullName)" >> $env:GITHUB_ENV

      - name: Locate the source-built plugin cache generator
        shell: pwsh
        run: |
          $generators = @(
            Get-ChildItem -LiteralPath $env:KMEDIAVLC_RAW_INSTALL -Recurse -File `
              -Filter 'vlc-cache-gen.exe'
          )
          if ($generators.Count -ne 1) {
            throw 'The source-built runtime has no unique VLC cache generator.'
          }
          "KMEDIAVLC_RAW_CACHE_GENERATOR=$($generators[0].FullName)" >> $env:GITHUB_ENV

      - name: Fetch the immutable Chromium HDR10 fixture
        shell: pwsh
        run: |
          $uri = 'https://chromium.googlesource.com/chromium/src/media/%2B/refs/heads/main/test/data/bear-1280x720-hevc-10bit-hdr10.mp4?format=TEXT'
          $fixture = Join-Path $env:RUNNER_TEMP 'bear-1280x720-hevc-10bit-hdr10.mp4'
          $encoded = (Invoke-WebRequest -Uri $uri -UseBasicParsing).Content
          [System.IO.File]::WriteAllBytes($fixture, [Convert]::FromBase64String($encoded))
          $expected = '49b960ac28ae13153ba8e62e3fceb50408564c21f25fc38936e7c8a06b61f2db'
          $actual = (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Chromium HDR10 fixture digest mismatch: $actual" }
          "KMEDIAVLC_TEST_HDR_MEDIA=$fixture" >> $env:GITHUB_ENV

      - name: Build the bridge natively with MSVC
        shell: pwsh
        run: |
          .\gradlew.bat check complianceCheck buildNativeBridge `
            -PkmediaVlcDesktopOnly=true `
            "-PkmediaVlcVlcSourceDir=$env:GITHUB_WORKSPACE\.vlc-source" `
            -PkmediaVlcNativeBuildType=Release `
            --no-daemon --stacktrace --console=plain
          $projects = @(
            Get-ChildItem build\native\windows-x86_64 -Recurse -File `
              -Filter 'kmediavlc_bridge.vcxproj'
          )
          if ($projects.Count -ne 1) {
            throw 'The native bridge has no unique generated MSVC project.'
          }
          $projectText = Get-Content -LiteralPath $projects[0].FullName -Raw
          if ($projectText -notmatch '<RuntimeLibrary>MultiThreadedDLL</RuntimeLibrary>') {
            throw 'The Release bridge is not explicitly linked to the dynamic MSVC runtime.'
          }
          "KMEDIAVLC_BRIDGE_PROJECT=$($projects[0].FullName)" >> $env:GITHUB_ENV

      - name: Stage the closed Windows playback candidate
        shell: pwsh
        run: |
          $bridge = Join-Path $env:GITHUB_WORKSPACE `
            'build\native\windows-x86_64\Release\kmediavlc_bridge.dll'
          if (-not (Test-Path -LiteralPath $bridge -PathType Leaf)) {
            throw 'The release-mode MSVC bridge binary is missing.'
          }
          $candidate = Join-Path $env:RUNNER_TEMP 'windows-x86_64-candidate'
          $report = Join-Path $env:RUNNER_TEMP 'windows-x86_64-staging-report.json'
          python scripts/stage_vlc_windows_runtime.py `
            --root $env:GITHUB_WORKSPACE `
            --install $env:KMEDIAVLC_RAW_INSTALL `
            --bridge $bridge `
            --output $candidate `
            --report $report
          if ($LASTEXITCODE -ne 0) { throw 'Closed Windows candidate staging failed.' }
          $stagingEvidence = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($stagingEvidence.auditCandidate -ne $false) {
            throw 'Windows release-mode staging produced an audit candidate.'
          }
          "KMEDIAVLC_TEST_LIBVLC=$(Join-Path $candidate 'bin\libvlc.dll')" >> $env:GITHUB_ENV
          "KMEDIAVLC_TEST_LIBVLCCORE=$(Join-Path $candidate 'bin\libvlccore-9.dll')" >> $env:GITHUB_ENV
          "KMEDIAVLC_TEST_PLUGINS=$(Join-Path $candidate 'lib\vlc\plugins')" >> $env:GITHUB_ENV
          "KMEDIAVLC_CANDIDATE=$candidate" >> $env:GITHUB_ENV
          "KMEDIAVLC_CANDIDATE_REPORT=$report" >> $env:GITHUB_ENV

      - name: Generate the plugin cache for the closed candidate
        shell: pwsh
        run: |
          $pluginCache = Join-Path $env:KMEDIAVLC_TEST_PLUGINS 'plugins.dat'
          if (Test-Path -LiteralPath $pluginCache) {
            throw 'The closed stager unexpectedly copied a generated plugin cache.'
          }
          $binDirectory = Split-Path -Parent $env:KMEDIAVLC_TEST_LIBVLC
          $env:PATH = "$binDirectory;$env:PATH"
          & $env:KMEDIAVLC_RAW_CACHE_GENERATOR $env:KMEDIAVLC_TEST_PLUGINS
          if ($LASTEXITCODE -ne 0) { throw 'Native VLC plugin cache generation failed.' }
          if (-not (Test-Path -LiteralPath $pluginCache -PathType Leaf) -or
              (Get-Item -LiteralPath $pluginCache).Length -le 0) {
            throw 'Native VLC plugin cache generation produced no cache.'
          }
          "KMEDIAVLC_TEST_PLUGIN_CACHE=$pluginCache" >> $env:GITHUB_ENV

      - name: Run the bridge and libVLC integration natively
        shell: pwsh
        run: |
          $bridge = Join-Path $env:GITHUB_WORKSPACE `
            'build\native\windows-x86_64\Release\kmediavlc_bridge.dll'
          if (-not (Test-Path -LiteralPath $bridge -PathType Leaf)) {
            throw 'The MSVC bridge binary is missing.'
          }
          .\gradlew.bat :runtime-desktop:test --rerun-tasks `
            -PkmediaVlcDesktopOnly=true `
            "-PkmediaVlcNativeBridgePath=$bridge" `
            "-PkmediaVlcTestLibVlcPath=$env:KMEDIAVLC_TEST_LIBVLC" `
            "-PkmediaVlcTestPluginDirectory=$env:KMEDIAVLC_TEST_PLUGINS" `
            "-PkmediaVlcTestHdrMedia=$env:KMEDIAVLC_TEST_HDR_MEDIA" `
            "-PkmediaVlcTestHttpsHdrMedia=$env:KMEDIAVLC_TEST_HTTPS_HDR_MEDIA" `
            -PkmediaVlcDebugCallbacks=true `
            --no-daemon --stacktrace --console=plain

      - name: Require executed native integration tests
        shell: pwsh
        run: |
          $testCases = @(
            Get-ChildItem runtime-desktop\build\test-results\test -Filter 'TEST-*.xml' |
              ForEach-Object { ([xml](Get-Content -LiteralPath $_.FullName -Raw)).testsuite.testcase }
          )
          foreach ($required in @(
            'loadsBridgeBuiltAgainstPinnedLibVlcHeaders()',
            'pinnedVideoLanFixturePublishesCpuPullFrame()',
            'pinnedChromiumHttpsFixturePublishesCpuPullFrame()'
          )) {
            $test = @($testCases | Where-Object { $_.name -eq $required })
            if ($test.Count -ne 1 -or $null -ne $test[0].skipped) {
              throw "Required native test did not execute: $required"
            }
          }
          $gpu = @($testCases | Where-Object {
            $_.name -eq 'pinnedVideoLanFixtureKeepsSdrD3D11FrameSrgbOnHdrHost()'
          })
          if ($gpu.Count -ne 1) { throw 'The native D3D11 test result is missing.' }
          if ($null -ne $gpu[0].skipped) {
            Write-Host 'Hosted runner has no eligible hardware DXGI adapter; hardware HDR evidence remains mandatory.'
          } else {
            Write-Host 'The native D3D11 import test executed on the hosted runner.'
          }
          $hdr = @($testCases | Where-Object {
            $_.name -eq 'pinnedChromiumHdr10FixturePublishesFp16D3D11Frame()'
          })
          if ($hdr.Count -ne 1) { throw 'The native HDR10 test result is missing.' }
          if ($null -ne $hdr[0].skipped) {
            Write-Host 'Hosted runner has no eligible hardware DXGI adapter; hardware HDR evidence remains mandatory.'
          } else {
            Write-Host 'The native HDR10 FP16 import test executed on the hosted runner.'
          }

      - name: Record native Windows validation evidence
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-validation-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $bridge = Join-Path $env:GITHUB_WORKSPACE `
            'build\native\windows-x86_64\Release\kmediavlc_bridge.dll'
          @(
            "kmediavlc=$env:TESTED_COMMIT"
            "vlc=$env:VLC_REVISION"
            "runner=$env:RUNNER_NAME"
            "os=$env:RUNNER_OS"
          ) | Set-Content -LiteralPath (Join-Path $evidence 'environment.txt')
          foreach ($file in @(
            $bridge,
            $env:KMEDIAVLC_TEST_LIBVLC,
            $env:KMEDIAVLC_TEST_LIBVLCCORE,
            $env:KMEDIAVLC_TEST_PLUGIN_CACHE,
            $env:KMEDIAVLC_TEST_HDR_MEDIA
          )) {
            if ($file -and (Test-Path -LiteralPath $file -PathType Leaf)) {
              Get-FileHash -LiteralPath $file -Algorithm SHA256 |
                Format-List Path,Hash |
                Out-File -LiteralPath (Join-Path $evidence 'native-SHA256SUMS.txt') -Append
            }
          }
          $results = 'runtime-desktop\build\test-results\test'
          if (Test-Path -LiteralPath $results) {
            Copy-Item -LiteralPath $results -Destination (Join-Path $evidence 'test-results') -Recurse
          }
          if ($env:KMEDIAVLC_CANDIDATE_REPORT -and
              (Test-Path -LiteralPath $env:KMEDIAVLC_CANDIDATE_REPORT -PathType Leaf)) {
            Copy-Item -LiteralPath $env:KMEDIAVLC_CANDIDATE_REPORT `
              -Destination (Join-Path $evidence 'staging-report.json')
          }
          if ($env:KMEDIAVLC_BRIDGE_PROJECT -and
              (Test-Path -LiteralPath $env:KMEDIAVLC_BRIDGE_PROJECT -PathType Leaf)) {
            Copy-Item -LiteralPath $env:KMEDIAVLC_BRIDGE_PROJECT `
              -Destination (Join-Path $evidence 'kmediavlc_bridge.vcxproj')
            $nativeRoot = Join-Path $env:GITHUB_WORKSPACE 'build\native\windows-x86_64'
            $linkLogs = @(
              Get-ChildItem -LiteralPath $nativeRoot -Recurse -File `
                -Filter 'link.command.1.tlog' |
                Where-Object { $_.Directory.Name -eq 'kmediavlc_bridge.tlog' }
            )
            if ($linkLogs.Count -ne 1) {
              throw 'The Release bridge has no unique MSVC link command log.'
            }
            Copy-Item -LiteralPath $linkLogs[0].FullName `
              -Destination (Join-Path $evidence 'bridge-link.command.1.tlog')
          }

      - name: Close the exact tested Windows runtime file set
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath $env:KMEDIAVLC_CANDIDATE -Recurse -File)
          if ($files.Count -ne 94) {
            throw "Closed Windows candidate has $($files.Count) files instead of 94."
          }
          $relative = @($files | ForEach-Object {
            $_.FullName.Substring($env:KMEDIAVLC_CANDIDATE.Length + 1).Replace('\', '/')
          })
          if (@($relative | Where-Object { $_ -like 'libexec/*' -or $_ -eq 'bin/vlc.exe' }).Count -ne 0) {
            throw 'The tested candidate contains a non-runtime executable.'
          }
          $hashes = foreach ($file in $files | Sort-Object FullName) {
            $path = $file.FullName.Substring($env:KMEDIAVLC_CANDIDATE.Length + 1).Replace('\', '/')
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $path"
          }
          $hashes | Set-Content -LiteralPath `
            (Join-Path $env:KMEDIAVLC_CANDIDATE 'SHA256SUMS') -Encoding ascii

      - name: Create and verify the candidate component inventory
        shell: pwsh
        run: |
          $inventory = Join-Path $env:RUNNER_TEMP 'windows-x86_64-native-inventory.json'
          $sourceOffer = "https://github.com/SuvioMedia/KMediaVlc/releases/download/" +
            "v$env:CANDIDATE_VERSION/kmedia-vlc-$env:CANDIDATE_VERSION-corresponding-source.tar.gz"
          python scripts/create_windows_native_inventory.py `
            --root $env:GITHUB_WORKSPACE `
            --staging $env:KMEDIAVLC_CANDIDATE `
            --output $inventory `
            --version $env:CANDIDATE_VERSION `
            --source-offer $sourceOffer
          if ($LASTEXITCODE -ne 0) { throw 'Candidate component inventory generation failed.' }
          .\gradlew.bat :runtime-desktop:verifyRuntimeJar :runtime-desktop:test `
            -PkmediaVlcDesktopOnly=true `
            "-PpublicationVersion=$env:CANDIDATE_VERSION" `
            "-PkmediaVlcNativeStagingDirectory=$env:KMEDIAVLC_CANDIDATE" `
            "-PkmediaVlcNativeInventory=$inventory" `
            -PkmediaVlcNativeTarget=windows-x86_64 `
            "-PkmediaVlcSourceOffer=$sourceOffer" `
            "-PrecipeRevision=$env:TESTED_COMMIT" `
            -PkmediaVlcTestBundledRuntime=true `
            --rerun-tasks `
            --no-daemon --stacktrace --console=plain
          $bundled = @(
            Get-ChildItem runtime-desktop\build\test-results\test -Filter 'TEST-*.xml' |
              ForEach-Object { ([xml](Get-Content -LiteralPath $_.FullName -Raw)).testsuite.testcase } |
              Where-Object { $_.name -eq 'bundledRuntimeExtractsAndPublishesCpuPullFrame' }
          )
          if ($bundled.Count -ne 1 -or $null -ne $bundled[0].skipped) {
            throw 'The packaged-JAR extraction and playback test did not execute.'
          }
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-validation-evidence'
          Copy-Item -LiteralPath 'runtime-desktop\build\test-results\test' `
            -Destination (Join-Path $evidence 'bundled-test-results') -Recurse
          $jar = Join-Path $env:GITHUB_WORKSPACE `
            "runtime-desktop\build\libs\runtime-desktop-$env:CANDIDATE_VERSION.jar"
          if (-not (Test-Path -LiteralPath $jar -PathType Leaf)) {
            throw 'Verified candidate runtime JAR is missing.'
          }
          "KMEDIAVLC_CANDIDATE_INVENTORY=$inventory" >> $env:GITHUB_ENV
          "KMEDIAVLC_CANDIDATE_JAR=$jar" >> $env:GITHUB_ENV

      - name: Archive the verified Windows candidate
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP `
            "kmediavlc-windows-x86_64-audit-candidate-$env:TESTED_COMMIT.zip"
          Compress-Archive -Path "$env:KMEDIAVLC_CANDIDATE\*" `
            -DestinationPath $archive -CompressionLevel Optimal
          $roundTrip = Join-Path $env:RUNNER_TEMP 'windows-x86_64-candidate-round-trip'
          python scripts/extract_windows_candidate.py `
            --archive $archive `
            --inventory $env:KMEDIAVLC_CANDIDATE_INVENTORY `
            --output $roundTrip
          if ($LASTEXITCODE -ne 0) { throw 'Archived Windows candidate did not round-trip.' }
          "KMEDIAVLC_CANDIDATE_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Upload native Windows validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kmediavlc-windows-x86_64-native-validation-${{ inputs.tested_commit }}
          path: ${{ runner.temp }}/windows-validation-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Upload the exact tested non-release Windows candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kmediavlc-windows-x86_64-tested-candidate-${{ inputs.tested_commit }}
          path: |
            ${{ env.KMEDIAVLC_CANDIDATE_ARCHIVE }}
            ${{ env.KMEDIAVLC_CANDIDATE_INVENTORY }}
            ${{ env.KMEDIAVLC_CANDIDATE_JAR }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
