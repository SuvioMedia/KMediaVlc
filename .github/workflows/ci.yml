name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # The Gradle native task deliberately targets the VS 17 2022 generator.
    runs-on: windows-2022
    steps:
      - name: Check out KMediaVlc
        uses: actions/checkout@v6

      - name: Check out the exact VLC headers
        uses: actions/checkout@v6
        with:
          repository: videolan/vlc
          ref: b5536cdea24b313ba9215eacfbd7fa3295d7f3ee
          path: .vlc-source
          sparse-checkout: include

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify JVM, licensing, and the native bridge
        shell: pwsh
        run: >-
          .\gradlew.bat check complianceCheck buildNativeBridge
          -PkmediaVlcDesktopOnly=true
          "-PkmediaVlcVlcSourceDir=$env:GITHUB_WORKSPACE\.vlc-source"
          --stacktrace --console=plain

  verify-macos-iosurface:
    runs-on: macos-15
    steps:
      - name: Check out KMediaVlc
        uses: actions/checkout@v6

      - name: Check out the exact VLC headers
        uses: actions/checkout@v6
        with:
          repository: videolan/vlc
          ref: b5536cdea24b313ba9215eacfbd7fa3295d7f3ee
          path: .vlc-source
          sparse-checkout: include

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the pinned-ABI bridge and hermetic libVLC fixture
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          ./gradlew buildNativeBridge \
            -PkmediaVlcDesktopOnly=true \
            -PkmediaVlcVlcSourceDir="$GITHUB_WORKSPACE/.vlc-source" \
            -PkmediaVlcBuildNativeTestFixtures=true \
            --stacktrace --console=plain
          otool -L build/native/macos-aarch64/libkmediavlc_bridge.dylib

      - name: Verify JVM, licensing, and real SDR/HDR IOSurfaces
        shell: bash
        run: |
          ./gradlew check complianceCheck \
            -PkmediaVlcDesktopOnly=true \
            -PkmediaVlcNativeBridgePath="$GITHUB_WORKSPACE/build/native/macos-aarch64/libkmediavlc_bridge.dylib" \
            -PkmediaVlcTestFakeLibVlcPath="$GITHUB_WORKSPACE/build/native/macos-aarch64/libkmediavlc_fake_libvlc.dylib" \
            --stacktrace --console=plain

  verify-android-anw:
    name: Verify Android AAR and ANativeWindow bridge
    runs-on: ubuntu-24.04
    steps:
      - name: Check out KMediaVlc
        uses: actions/checkout@v6

      - name: Check out the exact VLC 4 headers
        uses: actions/checkout@v6
        with:
          repository: videolan/vlc
          ref: b5536cdea24b313ba9215eacfbd7fa3295d7f3ee
          path: .vlc-source
          sparse-checkout: include

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the pinned Android toolchain
        shell: bash
        run: sdkmanager "platforms;android-37" "ndk;29.0.14206865" "cmake;4.1.2"

      - name: Verify the API-only AAR and JVM contract
        shell: bash
        run: >-
          bash gradlew :runtime-android:check
          -PkmediaVlcDesktopOnly=false
          --stacktrace --console=plain

      - name: Cross-compile both JNI ABIs against the pinned VLC 4 callback ABI
        shell: bash
        run: >-
          bash scripts/test_android_native_bridge.sh
          "$GITHUB_WORKSPACE/.vlc-source"
          "$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          "$ANDROID_SDK_ROOT/cmake/4.1.2/bin/cmake"
          "$RUNNER_TEMP/kmediavlc-android-native"
