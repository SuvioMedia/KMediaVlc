# SPDX-License-Identifier: LicenseRef-KMediaVlc-Proprietary

name: Linux libVLC source validation

on:
  workflow_dispatch:
    inputs:
      tested_commit:
        description: Exact forty-character KMediaVlc commit to validate
        required: true
        type: string
      candidate_version:
        description: Immutable SemVer intended for this audit candidate
        required: true
        default: 0.1.0-rc.1
        type: string
      audit_candidate:
        description: Build and test policies whose manual review is still pending
        required: true
        default: false
        type: boolean
  push:
    branches:
      - codex/linux-bundled-runtime
      - codex/bundled-libvlc4-integration
    paths:
      - .github/workflows/linux-source-audit.yml
      - build-recipes/linux.json
      - scripts/build_vlc_linux.sh
      - scripts/stage_vlc_linux_runtime.py
      - scripts/tests/test_stage_vlc_linux_runtime.py
      - scripts/verify_source_compliance.py
      - compliance/policy/linux-**
      - native/**
      - runtime-desktop/**

permissions:
  contents: read

concurrency:
  group: kmediavlc-linux-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    name: Source build and CPU playback (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            machine: x86_64
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      TESTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.tested_commit || github.sha }}
      CANDIDATE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version || '0.0.0-ci' }}
      AUDIT_CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_candidate || false }}
    steps:
      - name: Check out KMediaVlc
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.TESTED_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the exact VLC source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: videolan/vlc
          ref: e439692079a75cacb5f07310d1ec2dc20bfd1fe0
          path: .vlc-source
          fetch-depth: 1
          persist-credentials: false

      - name: Bind the validation to immutable sources
        shell: bash
        run: |
          set -euo pipefail
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          [[ "$TESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_VERSION" =~ $semver ]]
          [[ "${CANDIDATE_VERSION^^}" != *SNAPSHOT* ]]
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          test "$(git -C .vlc-source rev-parse HEAD)" = e439692079a75cacb5f07310d1ec2dc20bfd1fe0
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C .vlc-source status --porcelain --untracked-files=no)"
          python3 scripts/verify_source_compliance.py --root .

      - name: Install the explicit Linux build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            autoconf automake autopoint bison build-essential bzip2 ca-certificates \
            cmake curl file flex fontconfig gettext git gperf help2man jq \
            libdrm-dev libegl1-mesa-dev libfontconfig1-dev libgbm-dev \
            libgles2-mesa-dev libpulse-dev libtool-bin make nasm ninja-build \
            patch patchelf pkg-config python3 python3-venv ragel tar unzip \
            xz-utils yasm zstd

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Compile the Linux GBM EGL DMA-BUF bridge
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew buildNativeBridge \
            -PkmediaVlcDesktopOnly=true \
            -PkmediaVlcVlcSourceDir="$GITHUB_WORKSPACE/.vlc-source" \
            --no-daemon --stacktrace --console=plain
          test -f "$GITHUB_WORKSPACE/build/native/${{ matrix.target }}/libkmediavlc_bridge.so"

      - name: Build the pinned shared libVLC graph from source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          bash scripts/build_vlc_linux.sh \
            "$GITHUB_WORKSPACE/.vlc-source" \
            "$RUNNER_TEMP/vlc-linux-build" \
            4

      - name: Validate the bounded ELF install
        shell: bash
        run: |
          set -euo pipefail
          install="$RUNNER_TEMP/vlc-linux-build/vlc-${{ matrix.target }}"
          test -f "$install/lib/libvlc.so"
          test -f "$install/lib/libvlccore.so.9.0.0"
          test -L "$install/lib/libvlccore.so.9"
          test "$(readlink "$install/lib/libvlccore.so.9")" = libvlccore.so.9.0.0
          plugin_count="$(find "$install/lib/vlc/plugins" -type f -name 'lib*_plugin.so' | wc -l)"
          file_count="$(find "$install" -type f | wc -l)"
          test "$plugin_count" -ge 80
          test "$plugin_count" -le 350
          test "$file_count" -gt "$plugin_count"
          expected_machine='Advanced Micro Devices X86-64'
          if [[ "${{ matrix.target }}" == linux-aarch64 ]]; then
            expected_machine='AArch64'
          fi
          while IFS= read -r -d '' binary; do
            readelf -h "$binary" | grep -Fq 'Class:                             ELF64'
            readelf -h "$binary" | grep -Fq "Machine:                           $expected_machine"
          done < <(find "$install" -type f \( -name '*.so' -o -name '*.so.*' \) -print0)

      - name: Retain the exact Linux contrib source inputs
        shell: bash
        run: |
          set -euo pipefail
          source_inputs="$RUNNER_TEMP/vlc-${{ matrix.target }}-source-inputs"
          mkdir "$source_inputs"
          jq -r '.components[].sourceArchive' compliance/policy/linux-binary-components.json | \
            sort -u | while IFS= read -r archive; do
              test -f "$GITHUB_WORKSPACE/.vlc-source/contrib/tarballs/$archive"
              cp "$GITHUB_WORKSPACE/.vlc-source/contrib/tarballs/$archive" "$source_inputs/$archive"
            done
          test "$(find "$source_inputs" -type f | wc -l)" = 24
          (
            cd "$source_inputs"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Stage the closed runtime and play a real CPU frame
        shell: bash
        run: |
          set -euo pipefail
          install="$RUNNER_TEMP/vlc-linux-build/vlc-${{ matrix.target }}"
          bridge="$GITHUB_WORKSPACE/build/native/${{ matrix.target }}/libkmediavlc_bridge.so"
          test -f "$bridge"
          candidate="$RUNNER_TEMP/kmediavlc-${{ matrix.target }}-tested-candidate"
          mkdir "$candidate"
          stage="$candidate/runtime"
          report="$candidate/${{ matrix.target }}-audit.json"
          candidate_args=()
          if [[ "$AUDIT_CANDIDATE" == true ]]; then
            candidate_args+=(--allow-audit-candidate)
          fi
          python3 scripts/stage_vlc_linux_runtime.py \
            --root "$GITHUB_WORKSPACE" \
            --install "$install" \
            --bridge "$bridge" \
            --target "${{ matrix.target }}" \
            --output "$stage" \
            --report "$report" \
            "${candidate_args[@]}"
          test "$(jq -r .selectedPluginCount "$report")" = 85
          if [[ "$AUDIT_CANDIDATE" == true ]]; then
            test "$(jq -r .auditCandidate "$report")" = true
          else
            test "$(jq -r .auditCandidate "$report")" = false
          fi
          LD_LIBRARY_PATH="$stage/bin" bash ./gradlew :runtime-desktop:test \
            -PkmediaVlcDesktopOnly=true \
            -PkmediaVlcNativeBridgePath="$stage/bin/libkmediavlc_bridge.so" \
            -PkmediaVlcTestLibVlcPath="$stage/bin/libvlc.so.12" \
            -PkmediaVlcTestPluginDirectory="$stage/lib/vlc/plugins" \
            --tests '*.VlcDesktopPlayerIntegrationTest.pinnedVideoLanFixturePublishesCpuPullFrame' \
            --no-daemon --stacktrace --console=plain

      - name: Close the retained Linux candidate and publication inventory
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/kmediavlc-${{ matrix.target }}-tested-candidate"
          source_offer="https://github.com/SuvioMedia/KMediaVlc/releases/download/v$CANDIDATE_VERSION/kmedia-vlc-$CANDIDATE_VERSION-corresponding-source.tar.gz"
          candidate_args=()
          if [[ "$AUDIT_CANDIDATE" == true ]]; then
            candidate_args+=(--allow-audit-candidate)
          fi
          python3 scripts/create_posix_native_inventory.py \
            --root "$GITHUB_WORKSPACE" \
            --staging "$candidate/runtime" \
            --report "$candidate/${{ matrix.target }}-audit.json" \
            --output "$candidate/${{ matrix.target }}-native-inventory.json" \
            --target "${{ matrix.target }}" \
            --version "$CANDIDATE_VERSION" \
            --source-offer "$source_offer" \
            "${candidate_args[@]}"
          cp runtime-desktop/build/test-results/test/TEST-io.github.shusek.kmediavlc.runtime.desktop.VlcDesktopPlayerIntegrationTest.xml \
            "$candidate/test-results.xml"
          (
            cd "$candidate"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload the exact tested Linux candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kmediavlc-${{ matrix.target }}-tested-candidate-${{ env.TESTED_COMMIT }}
          path: ${{ runner.temp }}/kmediavlc-${{ matrix.target }}-tested-candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload the exact Linux contrib source inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vlc-${{ matrix.target }}-source-inputs-${{ env.TESTED_COMMIT }}
          path: ${{ runner.temp }}/vlc-${{ matrix.target }}-source-inputs
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
