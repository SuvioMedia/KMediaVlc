name: Android libVLC source and HDR release audit
run-name: Android source and physical HDR audit for ${{ inputs.tested_commit }}

on:
  workflow_dispatch:
    inputs:
      tested_commit:
        description: Exact forty-character KMediaVlc commit to validate
        required: true
        type: string
      candidate_version:
        description: Immutable SemVer intended for this candidate
        required: true
        default: 0.1.0-rc.1
        type: string

permissions:
  contents: read

concurrency:
  group: kmediavlc-android-release-${{ inputs.tested_commit }}
  cancel-in-progress: false

jobs:
  source-build-and-physical-hdr:
    name: Build both Android ABIs and run physical HDR acceptance
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, kmediavlc-android-hdr]
    timeout-minutes: 720
    env:
      TESTED_COMMIT: ${{ inputs.tested_commit }}
      CANDIDATE_VERSION: ${{ inputs.candidate_version }}
      VLC_REVISION: b5536cdea24b313ba9215eacfbd7fa3295d7f3ee
      LIBVLCJNI_REVISION: a8d53a9151d7e4a9a5dfd0a5eb1cd92669afdc21
      LLVM_PROJECT_REVISION: 386af4a5c64ab75eaee2448dc38f2e34a40bfed0
      LLVM_ANDROID_REVISION: 1dab3288f660d43a6cb2479107e2b54b3ab0a2a1
    steps:
      - name: Check out the exact KMediaVlc revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tested_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the exact VLC source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: videolan/vlc
          ref: b5536cdea24b313ba9215eacfbd7fa3295d7f3ee
          path: .audit-sources/vlc
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the exact libvlcjni source
        shell: bash
        run: |
          set -euo pipefail
          mkdir .audit-sources/libvlcjni
          git -C .audit-sources/libvlcjni init
          git -C .audit-sources/libvlcjni remote add origin \
            https://code.videolan.org/videolan/libvlcjni.git
          git -C .audit-sources/libvlcjni fetch --depth=1 origin "$LIBVLCJNI_REVISION"
          git -C .audit-sources/libvlcjni checkout --detach FETCH_HEAD

      - name: Check out the exact LLVM runtime source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: llvm/llvm-project
          ref: 386af4a5c64ab75eaee2448dc38f2e34a40bfed0
          path: .audit-sources/llvm-project
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the exact Android LLVM build source
        shell: bash
        run: |
          set -euo pipefail
          mkdir .audit-sources/llvm-android
          git -C .audit-sources/llvm-android init
          git -C .audit-sources/llvm-android remote add origin \
            https://android.googlesource.com/toolchain/llvm_android
          git -C .audit-sources/llvm-android fetch --depth=1 origin "$LLVM_ANDROID_REVISION"
          git -C .audit-sources/llvm-android checkout --detach FETCH_HEAD

      - name: Bind every Android input to immutable sources
        shell: bash
        run: |
          set -euo pipefail
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          [[ "$TESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_VERSION" =~ $semver ]]
          [[ "${CANDIDATE_VERSION^^}" != *SNAPSHOT* ]]
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          test "$(git -C .audit-sources/vlc rev-parse HEAD)" = "$VLC_REVISION"
          test "$(git -C .audit-sources/libvlcjni rev-parse HEAD)" = "$LIBVLCJNI_REVISION"
          test "$(git -C .audit-sources/llvm-project rev-parse HEAD)" = "$LLVM_PROJECT_REVISION"
          test "$(git -C .audit-sources/llvm-android rev-parse HEAD)" = "$LLVM_ANDROID_REVISION"
          printf '/.audit-sources/\n' >> .git/info/exclude
          test -z "$(git status --porcelain)"
          for checkout in vlc libvlcjni llvm-project llvm-android; do
            test -z "$(git -C ".audit-sources/$checkout" status --porcelain --untracked-files=no)"
          done
          python3 scripts/verify_source_compliance.py --root .

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up the exact Android build toolchain
        uses: android-actions/setup-android@v3

      - name: Install Android 36, NDK r29, and CMake 4.1.2
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;29.0.14206865" "cmake;4.1.2"

      - name: Build source libVLC and KMediaVlc for both Android ABIs
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/29.0.14206865"
          cmake="$ANDROID_HOME/cmake/4.1.2/bin/cmake"
          work="$RUNNER_TEMP/android-source-build"
          payload="$RUNNER_TEMP/android-native-payload"
          test -x "$cmake"
          mkdir "$payload"
          bash scripts/build_vlc_android.sh \
            "$GITHUB_WORKSPACE/.audit-sources/vlc" \
            "$GITHUB_WORKSPACE/.audit-sources/libvlcjni" \
            "$ndk" "$cmake" "$work" "$payload"
          echo "KMEDIAVLC_ANDROID_WORK=$work" >> "$GITHUB_ENV"
          echo "KMEDIAVLC_ANDROID_PAYLOAD=$payload" >> "$GITHUB_ENV"

      - name: Package and independently verify complete Android source
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct HEAD)"
          sources="$RUNNER_TEMP/android-source-packages"
          mkdir "$sources"
          ndk_source="$sources/kmedia-vlc-$CANDIDATE_VERSION-android-ndk-source.tar.gz"
          complete_source="$sources/kmedia-vlc-$CANDIDATE_VERSION-android-corresponding-source.tar.gz"
          python3 scripts/package_android_ndk_source.py \
            --root "$GITHUB_WORKSPACE" \
            --llvm-project "$GITHUB_WORKSPACE/.audit-sources/llvm-project" \
            --llvm-android "$GITHUB_WORKSPACE/.audit-sources/llvm-android" \
            --output "$ndk_source" \
            --tested-commit "$TESTED_COMMIT" \
            --version "$CANDIDATE_VERSION" \
            --epoch "$epoch"
          python3 scripts/verify_android_ndk_source_archive.py \
            --root "$GITHUB_WORKSPACE" \
            --archive "$ndk_source" \
            --llvm-project "$GITHUB_WORKSPACE/.audit-sources/llvm-project" \
            --llvm-android "$GITHUB_WORKSPACE/.audit-sources/llvm-android" \
            --version "$CANDIDATE_VERSION" \
            --tested-commit "$TESTED_COMMIT"
          python3 scripts/package_android_corresponding_source.py \
            --root "$GITHUB_WORKSPACE" \
            --vlc "$GITHUB_WORKSPACE/.audit-sources/vlc" \
            --libvlcjni "$GITHUB_WORKSPACE/.audit-sources/libvlcjni" \
            --contrib-tarballs "$GITHUB_WORKSPACE/.audit-sources/vlc/contrib/tarballs" \
            --ndk-source-archive "$ndk_source" \
            --llvm-project "$GITHUB_WORKSPACE/.audit-sources/llvm-project" \
            --llvm-android "$GITHUB_WORKSPACE/.audit-sources/llvm-android" \
            --legal-manifest "$KMEDIAVLC_ANDROID_PAYLOAD/legal/android-static-legal.json" \
            --arm64-audit "$KMEDIAVLC_ANDROID_WORK/link-audits/arm64-v8a.json" \
            --armv7-audit "$KMEDIAVLC_ANDROID_WORK/link-audits/armeabi-v7a.json" \
            --output "$complete_source" \
            --tested-commit "$TESTED_COMMIT" \
            --version "$CANDIDATE_VERSION" \
            --epoch "$epoch"
          python3 scripts/verify_android_corresponding_source_archive.py \
            --root "$GITHUB_WORKSPACE" \
            --archive "$complete_source" \
            --vlc "$GITHUB_WORKSPACE/.audit-sources/vlc" \
            --libvlcjni "$GITHUB_WORKSPACE/.audit-sources/libvlcjni" \
            --contrib-tarballs "$GITHUB_WORKSPACE/.audit-sources/vlc/contrib/tarballs" \
            --ndk-source-archive "$ndk_source" \
            --llvm-project "$GITHUB_WORKSPACE/.audit-sources/llvm-project" \
            --llvm-android "$GITHUB_WORKSPACE/.audit-sources/llvm-android" \
            --legal-manifest "$KMEDIAVLC_ANDROID_PAYLOAD/legal/android-static-legal.json" \
            --arm64-audit "$KMEDIAVLC_ANDROID_WORK/link-audits/arm64-v8a.json" \
            --armv7-audit "$KMEDIAVLC_ANDROID_WORK/link-audits/armeabi-v7a.json" \
            --version "$CANDIDATE_VERSION" \
            --tested-commit "$TESTED_COMMIT"
          echo "KMEDIAVLC_ANDROID_NDK_SOURCE=$ndk_source" >> "$GITHUB_ENV"
          echo "KMEDIAVLC_ANDROID_SOURCE=$complete_source" >> "$GITHUB_ENV"

      - name: Verify the exact two-ABI AAR candidate
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :runtime-android:check \
            -PkmediaVlcDesktopOnly=false \
            -PpublicationVersion="$CANDIDATE_VERSION" \
            -PkmediaVlcAndroidNativePayloadDirectory="$KMEDIAVLC_ANDROID_PAYLOAD" \
            -PkmediaVlcAndroidNdkSourceArchive="$KMEDIAVLC_ANDROID_NDK_SOURCE" \
            -PkmediaVlcAndroidLlvmProjectSourceDirectory="$GITHUB_WORKSPACE/.audit-sources/llvm-project" \
            -PkmediaVlcAndroidLlvmAndroidSourceDirectory="$GITHUB_WORKSPACE/.audit-sources/llvm-android" \
            -PkmediaVlcAndroidCorrespondingSourceArchive="$KMEDIAVLC_ANDROID_SOURCE" \
            -PkmediaVlcAndroidVlcSourceDirectory="$GITHUB_WORKSPACE/.audit-sources/vlc" \
            -PkmediaVlcAndroidLibvlcjniSourceDirectory="$GITHUB_WORKSPACE/.audit-sources/libvlcjni" \
            -PkmediaVlcAndroidContribTarballsDirectory="$GITHUB_WORKSPACE/.audit-sources/vlc/contrib/tarballs" \
            -PkmediaVlcAndroidArm64LinkAudit="$KMEDIAVLC_ANDROID_WORK/link-audits/arm64-v8a.json" \
            -PkmediaVlcAndroidArmv7LinkAudit="$KMEDIAVLC_ANDROID_WORK/link-audits/armeabi-v7a.json" \
            -PrecipeRevision="$TESTED_COMMIT" \
            --no-daemon --stacktrace --console=plain

      - name: Select one authorized physical Android device
        shell: bash
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          mapfile -t devices < <("$adb" devices | awk 'NR > 1 && $2 == "device" {print $1}')
          test "${#devices[@]}" = 1
          echo "KMEDIAVLC_ADB=$adb" >> "$GITHUB_ENV"
          echo "KMEDIAVLC_DEVICE_SERIAL=${devices[0]}" >> "$GITHUB_ENV"

      - name: Run physical MediaCodec, software, lifecycle, and HDR acceptance
        shell: bash
        run: |
          set -euo pipefail
          acceptance="$RUNNER_TEMP/android-physical-acceptance"
          bash scripts/run_android_device_smoke.sh \
            "$KMEDIAVLC_ANDROID_PAYLOAD" \
            "$acceptance" \
            "$KMEDIAVLC_ADB" \
            "$KMEDIAVLC_DEVICE_SERIAL" \
            "$TESTED_COMMIT"
          test "$(jq -r .kmediaVlcCommit "$acceptance/acceptance.json")" = "$TESTED_COMMIT"
          test "$(jq -r '.testCases | length' "$acceptance/acceptance.json")" = 3
          jq -e '.testCases == [
            "automaticDecodePreservesHdr10SurfaceSignal",
            "automaticDecodeUsesMediaCodecAndSurvivesSurfaceLifecycle",
            "softwareDecodeAvoidsMediaCodecAndSurvivesSurfaceLifecycle"
          ]' "$acceptance/acceptance.json" >/dev/null
          echo "KMEDIAVLC_ANDROID_ACCEPTANCE=$acceptance" >> "$GITHUB_ENV"

      - name: Close the retained Android audit artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/kmediavlc-android-release-candidate"
          mkdir -p "$artifact/evidence/link-audits" "$artifact/verification-inputs"
          cp -R "$KMEDIAVLC_ANDROID_PAYLOAD" "$artifact/payload"
          cp "$KMEDIAVLC_ANDROID_NDK_SOURCE" "$KMEDIAVLC_ANDROID_SOURCE" "$artifact/"
          cp "$KMEDIAVLC_ANDROID_WORK/link-audits/arm64-v8a.json" \
            "$artifact/evidence/link-audits/arm64-v8a.json"
          cp "$KMEDIAVLC_ANDROID_WORK/link-audits/armeabi-v7a.json" \
            "$artifact/evidence/link-audits/armeabi-v7a.json"
          cp -R "$KMEDIAVLC_ANDROID_ACCEPTANCE" "$artifact/evidence/physical-acceptance"
          cp runtime-android/build/outputs/aar/runtime-android-release.aar \
            "$artifact/kmedia-vlc-$CANDIDATE_VERSION-android-candidate.aar"
          mkdir "$artifact/verification-inputs/contrib-tarballs"
          jq -r '.contribComponents[].sourceArchives[]' compliance/policy/android-static-components.json | \
            sort -u | while IFS= read -r archive; do
              cp "$GITHUB_WORKSPACE/.audit-sources/vlc/contrib/tarballs/$archive" \
                "$artifact/verification-inputs/contrib-tarballs/$archive"
            done
          (
            cd "$artifact"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload the source-built Android AAR and physical HDR evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kmediavlc-android-release-candidate-${{ inputs.tested_commit }}
          path: ${{ runner.temp }}/kmediavlc-android-release-candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
