# KMediaVlc's reviewed Apple profile for VideoLAN's pinned
# extras/package/apple/build.sh entry point. This file is sourced by that
# script, so VLC_SCRIPT_DIR refers to the pinned upstream Apple recipe.
. "$VLC_SCRIPT_DIR/build.conf"

# KMediaPlayer supports Apple-silicon desktop playback on macOS 14 or newer.
# Keeping the deployment target here makes it part of the source recipe rather
# than an ambient Xcode setting.
export VLC_DEPLOYMENT_TARGET_MACOSX="14.0"

# Start from an empty contrib graph. Every selected package and every
# dependency introduced by VideoLAN's pinned rules is audited after linking.
# In particular, this excludes the default OpenCV, libplacebo/Vulkan,
# discovery, remote-filesystem, encoder, and Rust-tooling graph.
export VLC_CONTRIB_OPTIONS_BASE=(
    --disable-all
    --disable-gpl
    --disable-gnuv3
    --disable-sout
    --enable-ad-clauses
    --enable-ass
    --enable-dav1d
    --enable-dvbpsi
    --enable-ebml
    --enable-ffmpeg
    --enable-flac
    --enable-freetype2
    --enable-fribidi
    --enable-harfbuzz
    --enable-jpeg
    --enable-libxml2
    --enable-matroska
    --enable-ogg
    --enable-opus
    --enable-png
    --enable-soxr
    --enable-vorbis
    --enable-vpx
    --enable-zlib
)
export VLC_CONTRIB_OPTIONS_MACOSX=()

# libVLC remains dynamically replaceable. Only playback-facing modules needed
# by the bundled API are enabled; the installed Mach-O graph is closed again
