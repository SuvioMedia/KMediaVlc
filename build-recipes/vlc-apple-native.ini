# Build-machine compilers for native generators inside Apple cross builds.
# Target compilers, flags, SDK, and deployment version remain in VLC's
# generated cross-file and are intentionally absent here.
[binaries]
c = '/usr/bin/cc'
cpp = '/usr/bin/c++'
objc = '/usr/bin/cc'
objcpp = '/usr/bin/c++'
